name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bboks-timer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bboks-timer-apk
          path: bboks-timer.apk

      - name: Publish as "latest" release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 뽁타이머 최신 APK
          body: 안드로이드 폰에서 bboks-timer.apk 를 받아 설치하세요.
          files: bboks-timer.apk
          make_latest: true
